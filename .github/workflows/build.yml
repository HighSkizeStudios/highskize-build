name: Build Windows Executables

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller
      - name: Build highskize.py
        run: pyinstaller --onefile highskize.py
      - name: Build highskize_remade.py
        run: pyinstaller --onefile highskize-remade/highskize_remade.py
      - name: Upload Windows executables
        uses: actions/upload-artifact@v3
        with:
          name: highskize-windows
          path: |
            dist/highskize.exe
            dist/highskize_remade.exe
